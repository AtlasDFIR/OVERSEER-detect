# Indexes the detections expect. Mounted into the container at boot.
[endpoint]
homePath   = $SPLUNK_DB/endpoint/db
coldPath   = $SPLUNK_DB/endpoint/colddb
thawedPath = $SPLUNK_DB/endpoint/thaweddb

[auth]
homePath   = $SPLUNK_DB/auth/db
coldPath   = $SPLUNK_DB/auth/colddb
thawedPath = $SPLUNK_DB/auth/thaweddb

[cloud]
homePath   = $SPLUNK_DB/cloud/db
coldPath   = $SPLUNK_DB/cloud/colddb
thawedPath = $SPLUNK_DB/cloud/thaweddb

[network]
homePath   = $SPLUNK_DB/network/db
coldPath   = $SPLUNK_DB/network/colddb
thawedPath = $SPLUNK_DB/network/thaweddb
